<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="帷幕 The Veil — 提灯（暖光）">
  <!--
    帷幕 The Veil · 方形母版 1024×1024（E1b 暖光提灯，正式定稿）
    整体包围盒 y 224–800、x 372–652：中心 (512,512)，上下留白 224 / 224。
    提梁：顶梁 (428,224)–(596,264) 宽 168 × 40；两条 36 宽的腿落到 308（比顶块多压 20，保证不断块）。
    顶块：x 424–600 宽 176 × 40（288–328）。
    宽檐：x 372–652 宽 280 = 灯身 224 的 1.250 倍 × 52。
    灯身：x 400–624 宽 224、y 380–728 高 348（高宽比 1.554）。
    灯框：四边 24 宽；玻璃面 424–600 × 404–704。
    分格：两根 24 宽竖框（452–476 / 548–572），玻璃 28 / 72 / 28 三格。
    火焰：尖顶 (512,466)、平底 606、最宽 60，高 140；负空间，透出琥珀亮芯。
    底座：x 384–640 宽 256（1.143 倍）× 64；双脚各 40 × 24。
  -->
  <defs>
