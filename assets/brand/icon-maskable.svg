    <rect x="560" y="264" width="36" height="28" fill="#E0A94B"/>
    <rect x="424" y="272" width="176" height="40" fill="#F6E7C4"/>
    <rect x="372" y="312" width="280" height="52" fill="#F6E7C4"/>
    <rect x="384" y="712" width="256" height="64" fill="#F6E7C4"/>
    <rect x="408" y="776" width="40" height="24" fill="#F6E7C4"/>
