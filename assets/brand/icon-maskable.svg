<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="帷幕 The Veil — 可遮罩提灯">
  <!--
    maskable（E1b 暖光提灯）：背景铺满整张画布，内容组以 (512,512) 为心缩放 1.20。
    E1b 包围盒 x 372–652 / y 224–800，缩放后 x 344–680 / y 166–858；
    最远点 (680,166) 距中心约 384，仍在 80% 安全圆 r 409.6 内。
  -->
  <defs>
    <mask id="e1bPaneMaskable" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="424" y="388" width="176" height="300" fill="#FFFFFF"/>
      <path d="M512 450 C497 486 486 522 482 550 C480 568 484 584 492 590 L532 590 C540 584 544 568 542 550 C538 522 527 486 512 450 Z" fill="#000000"/>
    </mask>
    <mask id="e1bBodyMaskable" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="400" y="364" width="224" height="348" fill="#FFFFFF"/>
      <rect x="424" y="388" width="176" height="300" fill="#000000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="#17110A"/>
  <g transform="translate(512 512) scale(1.2) translate(-512 -512)">
    <circle cx="512" cy="528" r="248" fill="#3A2A12"/>
    <ellipse cx="512" cy="550" rx="108" ry="140" fill="#FFE9B0"/>
    <rect x="424" y="388" width="176" height="300" fill="#5C4218" mask="url(#e1bPaneMaskable)"/>
