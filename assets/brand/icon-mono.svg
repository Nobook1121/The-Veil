<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" style="color:#E8E0CD" role="img" aria-label="帷幕 The Veil — 单色提灯">
  <!-- 单色版（E1b 暖光提灯）：透明底、单一 currentColor。玻璃并入灯框，灯身成为一块实心，
       剪影只剩「提梁 + 顶块 + 宽檐 + 身 + 底座 + 双脚」；火焰保留为负空间（尖顶 / 平底）。
       在 HTML 内联时改 svg 的 color 即可整体换色（压印 / 水印 / 头像）。 -->
  <defs>
    <mask id="e1bBodyM" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="400" y="364" width="224" height="348" fill="#FFFFFF"/>
      <path d="M512 450 C497 486 486 522 482 550 C480 568 484 584 492 590 L532 590 C540 584 544 568 542 550 C538 522 527 486 512 450 Z" fill="#000000"/>
    </mask>
  </defs>
  <g style="color:#E8E0CD">
    <g mask="url(#e1bBodyM)">
      <rect x="400" y="364" width="224" height="348" fill="currentColor"/>
    </g>
    <rect x="428" y="224" width="168" height="40" fill="currentColor"/>
    <rect x="428" y="264" width="36" height="28" fill="currentColor"/>
    <rect x="560" y="264" width="36" height="28" fill="currentColor"/>
    <rect x="424" y="272" width="176" height="40" fill="currentColor"/>
    <rect x="372" y="312" width="280" height="52" fill="currentColor"/>
    <rect x="384" y="712" width="256" height="64" fill="currentColor"/>
    <rect x="408" y="776" width="40" height="24" fill="currentColor"/>
    <rect x="576" y="776" width="40" height="24" fill="currentColor"/>
  </g>
</svg>
