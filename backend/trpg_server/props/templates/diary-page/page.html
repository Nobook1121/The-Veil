<div class="diary">
  <table class="diary-head" width="100%">
    <tr>
      <td class="diary-title">日 记</td>
      <td class="diary-date">{{date}}</td>
    </tr>
  </table>
  <hr class="diary-rule" style="border-top-color: {{accent}};"/>
  <div class="diary-body" style="color: {{ink}};">{{body_html}}</div>
  <div class="diary-struck">{{struck_html}}</div>
  {{wear_stain}}
  {{wear_tear}}
  {{wear_fold}}
</div>
