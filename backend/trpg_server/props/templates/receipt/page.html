<div class="receipt">
  <div class="shop">{{shop}}</div>
  <div class="date">日期：{{date}}</div>
  <hr class="dash" style="border-top-color: {{accent}};"/>
  <div class="items">{{items_lines}}</div>
  <hr class="dash" style="border-top-color: {{accent}};"/>
  <table class="total-row" width="100%">
    <tr>
      <td class="total-label" width="55%">合计</td>
      <td class="total" width="45%">{{total}}</td>
    </tr>
  </table>
  <div class="note">{{note}}</div>
  {{wear_fold}}
  {{wear_stain}}
</div>
