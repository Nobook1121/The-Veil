<div class="paper">
  <table class="letter-head" width="100%">
    <tr>
      <td class="salutation">{{salutation}}</td>
      <td class="date">{{date}}</td>
    </tr>
  </table>
  <hr class="rule" style="border-top-color: {{accent}};"/>
  <div class="letter-body" style="color: {{ink}};">{{body_html}}</div>
  <div class="letter-foot">
    <p class="signature" style="color: {{ink}};">{{signature}}</p>
    <p class="postscript">{{postscript}}</p>
  </div>
</div>
