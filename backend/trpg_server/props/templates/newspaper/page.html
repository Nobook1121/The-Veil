<div class="paper">
<table class="np" width="100%">
  <tr>
    <td colspan="2" class="np-masthead">《{{city}}日报》</td>
  </tr>
  <tr>
    <td colspan="2" class="np-date">{{date}} · 第 {{issue}} 期</td>
  </tr>
  <tr>
    <td colspan="2" class="np-headline">{{headline}}</td>
  </tr>
  <tr>
    <td class="np-col" width="50%">{{col1_html}}</td>
    <td class="np-col" width="50%">{{col2_html}}</td>
  </tr>
  <tr>
    <td colspan="2" class="np-ad">{{ad_html}}</td>
  </tr>
</table>
{{wear_stain}}
{{wear_fold}}
{{wear_tear}}
</div>
