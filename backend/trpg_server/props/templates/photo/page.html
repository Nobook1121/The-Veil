<div class="photo-page">
  <div class="photo-caption">{{caption}}</div>
  <table class="photo-frame" width="100%">
    <tr>
      <td class="photo-cell" height="420">{{photo_img}}</td>
    </tr>
  </table>
  <div class="photo-date">{{date}}</div>
  <hr class="photo-divider" style="border-top-color: {{accent}};"/>
  <div class="photo-back-title">背面题字</div>
  <div class="photo-back" style="color: {{ink}};">{{back_text_html}}</div>
  {{wear_stain}}
  {{wear_fold}}
  {{wear_tear}}
</div>
