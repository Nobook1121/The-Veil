[pytest]
# 全局超时兜底。Windows 上 signal 方式（SIGALRM）不可用，必须用 thread：
# 超时后 pytest-timeout 会打印所有线程的调用栈，再以非 0 退出码结束进程。
# 全量套件约 95–175 秒，单用例耗时远小于 180 秒；这里只兜“真的卡死”，
# 不给正常慢用例制造假失败。可用 -p no:timeout 或 --timeout=0 临时关闭。
timeout = 180
timeout_method = thread
markers =
    kiwee_real: 真实 kiwee 快照（117MB）集成测试——本地需先 fetch+build kiwee.sqlite3，库不存在即 skip
