<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Concept C — The Seal">
  <!--
    方案 C · 封缄与缺口
    母题形状 2 个：一枚断口环 + 一块崩落在环外的碎片。
    环外半径 384、内半径 240、带宽 144；缺口在 -72°～-30°（42°），两端是干净的径向切面。
    碎片是同一圈环带的一段（-66°～-44°、半径 404～500），整体旋转 9°，与环之间留 20 的空隙。
  -->
  <defs>
    <radialGradient id="plate" cx="512" cy="480" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B211E"/>
      <stop offset="0.55" stop-color="#071613"/>
      <stop offset="1" stop-color="#030A09"/>
    </radialGradient>
    <linearGradient id="ringBrass" x1="240" y1="200" x2="840" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0D79A"/>
      <stop offset="0.5" stop-color="#C7A25C"/>
      <stop offset="1" stop-color="#8E6C39"/>
    </linearGradient>
    <linearGradient id="shardBrass" x1="700" y1="60" x2="860" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBEBC3"/>
      <stop offset="1" stop-color="#D3AF6A"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#plate)"/>

  <path d="M844.55 320 A384 384 0 1 1 630.66 146.79 L586.16 283.75 A240 240 0 1 0 719.85 392 Z" fill="url(#ringBrass)"/>

  <path d="M676.32 142.93 A404 404 0 0 1 802.61 231.36 L871.67 164.67 A500 500 0 0 0 715.37 55.23 Z" fill="url(#shardBrass)" transform="rotate(9 512 512)"/>
</svg>
