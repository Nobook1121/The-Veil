<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Concept B — The Facet">
  <!--
    方案 B · 骰之切面
    母题形状 3 个：正六边形被三条 120° 等分的切线切成 3 个菱形面（不计底板与切线色带）。
    六边形外接圆 R=380、圆心 (512,512)，顶点在 270°/330°/30°/90°/150°/210°；
    切线由圆心指向 270°、30°、150° 三个互隔 120° 的顶点。
    明暗：右上受光、左下背光、底部中间调。
  -->
  <defs>
    <radialGradient id="plate" cx="512" cy="480" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B211E"/>
      <stop offset="0.55" stop-color="#071613"/>
      <stop offset="1" stop-color="#030A09"/>
    </radialGradient>
    <linearGradient id="facetLight" x1="580" y1="200" x2="840" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5DDA4"/>
      <stop offset="1" stop-color="#C7A25C"/>
    </linearGradient>
    <linearGradient id="facetMid" x1="780" y1="720" x2="360" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C7A25C"/>
      <stop offset="1" stop-color="#8E6C39"/>
    </linearGradient>
    <linearGradient id="facetDark" x1="320" y1="240" x2="240" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A07B44"/>
      <stop offset="1" stop-color="#6B5228"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#plate)"/>

  <path d="M512 512 L182.92 322 L182.92 702 L512 132 Z" fill="url(#facetDark)"/>
  <path d="M512 512 L841.08 702 L512 892 L182.92 702 Z" fill="url(#facetMid)"/>
  <path d="M512 512 L512 132 L841.08 322 L841.08 702 Z" fill="url(#facetLight)"/>

  <!-- 三条切线，64 宽，用底板色切开三个面 -->
  <path d="M512 512 L512 132 M512 512 L841.08 702 M512 512 L182.92 702" fill="none" stroke="#071613" stroke-width="64"/>
</svg>
