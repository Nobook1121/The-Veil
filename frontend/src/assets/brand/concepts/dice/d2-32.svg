<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="D2 — 32px 独立重画">
  <!--
    D2 · 32px 独立重画（坐标落在 32 的整数倍）
    六边形：上 (512,192)、上右 (800,352)、下右 (800,672)、下 (512,832)、下左 (224,672)、上左 (224,352)；
        宽 576 = 18px、高 640 = 20px。
    刻点 r=48（直径 3px）；三面明度保持 78/55/32，保证 32px 仍能看出三个朝向。
  -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#E9E1CF"/>
  <path d="M224 352 L512 512 L512 832 L224 672 Z" fill="#2F6E64"/>
  <path d="M800 352 L800 672 L512 832 L512 512 Z" fill="#17453F"/>
  <path d="M224 352 L512 192 L800 352 L512 512 Z" fill="#4E9E8E"/>
  <circle cx="512" cy="352" r="48" fill="#E9E1CF"/>
</svg>
