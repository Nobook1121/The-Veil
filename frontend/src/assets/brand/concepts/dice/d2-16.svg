<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="D2 — 16px 独立重画">
  <!--
    D2 · 16px 独立重画：按约定退化成六边形剪影，只留中间明度一面，刻点删除。
    六边形：宽 576 = 9px、高 640 = 10px，与 32px 档同比例（高宽比 1.111），
    这样 16 与 32 并排不会被看成两个不同的图形。
  -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#E9E1CF"/>
  <path d="M512 192 L800 352 L800 672 L512 832 L224 672 L224 352 Z" fill="#2F6E64"/>
</svg>
