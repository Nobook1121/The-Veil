<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="E1 — 16px 独立重画">
  <!--
    E1 · 16px 独立重画（坐标落在 64 的整数倍）
    16px 删提环与台沿的 16 单位退台，只留「灯罩梯形 + 灯座横条 + 光晕圆」：
    灯身 384×352 = 6×5.5px，灯座 256 = 4px 宽；光晕盘 r=256（直径 8px）。
    光学修正：灯身压进光晕盘内圈（208 < 256），光晕才不会被灯身顶穿。
  -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#070A12"/>
  <circle cx="512" cy="496" r="256" fill="#17314F"/>
  <path d="M448 320 L576 320 L608 640 L640 640 L640 672 L384 672 L384 640 L416 640 Z" fill="#E8F2FF"/>
</svg>
