<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="D3 — 32px 独立重画">
  <!--
    D3 · 32px 独立重画（坐标落在 32 的整数倍）
    三角：顶点 (512,256)，底边 (224,768)–(800,768)；高 512 = 16px、底 576 = 18px。
    折缝：宽 96 = 3px（母版 112/720 = 15.5%，这里 96/576 = 16.7%，略加宽补偿）。
    折线 (404,448) → (544,656) → (602,416)，两端各出边 64 由三角裁掉。
  -->
  <defs>
    <clipPath id="d3tri32">
      <path d="M512 256 L224 768 L800 768 Z"/>
    </clipPath>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#0C0810"/>
  <path d="M512 256 L224 768 L800 768 Z" fill="#D86A5F"/>
  <path d="M300 560 L364 475 L528 672 L649 427 L800 768 L224 768 Z" fill="#7E3A34" clip-path="url(#d3tri32)"/>
</svg>
