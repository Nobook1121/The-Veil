<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="E1 — 提灯与光晕">
  <!--
    E1 · 提灯（叙述者的光）
    形状 2 + 光晕 1：灯身（一条闭合路径：灯罩 + 灯座）/ 提环 / 光晕盘。
    灯罩：上边 (444,336)–(580,336) 宽 136；下边 (420,592)–(604,592) 宽 184；高 256。
    灯座：(404,592)–(620,644)，宽 216、高 52，两侧各出 16 台沿。
    火焰：灯罩内的负空间，尖顶 (512,396) 圆底 (512,566)，最宽处 52 —— 让「灯里有一团光」成立，
        而不是只剩一个白色梯形。
    光晕：圆心 (512,496)、r=284（第二层色）；灯身按 1.2 倍放大后用底板色重画，形成 1.2→1.0 的负空间光环。
    提环：圆心 (512,268)、r=32、描边 20；环底 310 与罩顶 336 留 26。
  -->
  <defs>
    <mask id="e1flame" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <path d="M444 336 L580 336 L604 592 L620 592 L620 644 L404 644 L404 592 L420 592 Z" fill="#FFFFFF"/>
      <path d="M512 396 C486 448 486 516 512 566 C538 516 538 448 512 396 Z" fill="#000000"/>
    </mask>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#070A12"/>
  <circle cx="512" cy="496" r="284" fill="#17314F"/>
  <path d="M444 336 L580 336 L604 592 L620 592 L620 644 L404 644 L404 592 L420 592 Z" fill="#070A12"
        transform="translate(512 502) scale(1.2) translate(-512 -502)"/>
  <g mask="url(#e1flame)">
    <path d="M444 336 L580 336 L604 592 L620 592 L620 644 L404 644 L404 592 L420 592 Z" fill="#E8F2FF"/>
  </g>
  <circle cx="512" cy="268" r="32" fill="none" stroke="#6EA8FF" stroke-width="20"/>
</svg>
