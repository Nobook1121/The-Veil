<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="D3 — 16px 单色">
  <!-- 16px 单色：折缝 128 = 2px，剪影被切成上小下大两块，仍能读出「里外两层」。 -->
  <defs>
    <mask id="d3cut16" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <path d="M512 256 L256 768 L768 768 Z" fill="#FFFFFF"/>
      <path d="M386 392 L536 672 L581 353" stroke="#000000" stroke-width="128"/>
    </mask>
  </defs>
  <g style="color:#E8E0CD" mask="url(#d3cut16)">
    <path d="M512 256 L256 768 L768 768 Z" fill="currentColor"/>
  </g>
</svg>
