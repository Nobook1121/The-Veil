<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="D1 — d20 单面被掀起">
  <!--
    D1 · d20 单面被掀起（命运翻开一页）
    形状 2：正三角面 + 掀起的底面（不含圆角底板）。
    面：顶点 (512,168)，底边 (184,736)–(840,736)；底 656、高 568，
        半顶角 tan⁻¹(328/568)=30.0°，两边 655.9 ≈ 底 656 → 等边。
    掀起片：以底边为轴翻折，左端几乎合上、右端掀开——
        缝从 6（x=196）张开到 62（x=836），这是「铰在一端」的透视，而不是平移。
        片厚也随开合变大：左端 86 → 右端 116（露出更多底面）。
    明度：面为受光的骨白，掀起片是背光的暗黄铜，两者不受光方向混淆。
  -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#1D3A34"/>
  <path d="M196 742 L836 798 L800 908 L240 816 Z" fill="#8E6C39"/>
  <path d="M512 168 L184 736 L840 736 Z" fill="#F6F1E7"/>
</svg>
