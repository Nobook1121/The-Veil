<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="D2 — 等轴骰三面（单色）">
  <!-- 单色版：三面同色会并成六边形，因此用 28 宽的透明 Y 缝（O→TR、O→TL、O→B）把三个面分出来。 -->
  <defs>
    <mask id="d2cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <path d="M512 176 L803 344 L803 672 L512 848 L221 672 L221 344 Z" fill="#FFFFFF"/>
      <path d="M512 512 L803 344 M512 512 L221 344 M512 512 L512 848" stroke="#000000" stroke-width="28"/>
    </mask>
  </defs>
  <g style="color:#E8E0CD" mask="url(#d2cut)">
    <path d="M512 176 L803 344 L803 672 L512 848 L221 672 L221 344 Z" fill="currentColor"/>
  </g>
</svg>
