<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="D1 — 16px 独立重画">
  <!--
    D1 · 16px 独立重画（坐标落在 64 的整数倍）
    面：顶点 (512,224)，底边 (288,608)–(736,608)；高 384 = 6px、底 448 = 7px（略压扁抗尖细）。
    缝：左端 32 = 0.5px、右端 64 = 1px；片厚 96 = 1.5px → 128 = 2px。
    光学修正：16px 上缝宽必须「左薄右厚」才读得出铰在一端，等宽的 1px 会被看成底座。
  -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#1D3A34"/>
  <path d="M320 640 L736 672 L704 800 L352 736 Z" fill="#8E6C39"/>
  <path d="M512 224 L288 608 L736 608 Z" fill="#F6F1E7"/>
</svg>
