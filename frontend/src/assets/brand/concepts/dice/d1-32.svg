<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="D1 — 32px 独立重画">
  <!--
    D1 · 32px 独立重画（坐标落在 32 的整数倍）
    面：顶点 (512,192)，底边 (224,704)–(800,704)；高 512 = 16px、底 576 = 18px。
    缝：左端 32 = 1px、右端 64 = 2px；片厚 64 = 2px → 96 = 3px。
    光学修正：把母版 6→62 的缝整体抬到整像素区间，左端不再灰成 0.2px 的雾线。
  -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#1D3A34"/>
  <path d="M224 736 L800 768 L768 864 L256 800 Z" fill="#8E6C39"/>
  <path d="M512 192 L224 704 L800 704 Z" fill="#F6F1E7"/>
</svg>
