<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="D3 — d4 内的负空间">
  <!--
    D3 · d4 内的负空间（留白）
    形状 3：外三角（上片）/ 内片（下片）/ 折缝负空间（不画，直接露底板）。
    外三角：顶点 (512,152)，底边 (152,776)–(872,776)；底 720、高 624，
        半顶角 tan⁻¹(360/624)=30.0° → 等边 720。
    折缝：折线 L(328,470) → 拐点 M(548,668) → R(657,404)，线宽 112；
        L、R 分别落在左、右边缘上，所以缝把三角切成上下两片。
    重心：拐点 y=668 明显低于三角重心 568，暗片压在下方，视觉重心偏下。
  -->
  <defs>
    <clipPath id="d3tri">
      <path d="M512 152 L152 776 L872 776 Z"/>
    </clipPath>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#0C0810"/>
  <path d="M512 152 L152 776 L872 776 Z" fill="#D86A5F"/>
  <path d="M220 600 L290 512 L514 714 L709 425 L872 776 L152 776 Z" fill="#7E3A34" clip-path="url(#d3tri)"/>
</svg>
