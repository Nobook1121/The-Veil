    <rect x="448" y="128" width="128" height="64" fill="currentColor"/>
    <rect x="320" y="192" width="384" height="128" fill="currentColor"/>
    <rect x="384" y="320" width="256" height="448" fill="currentColor"/>
    <rect x="320" y="768" width="384" height="64" fill="currentColor"/>
    <rect x="384" y="832" width="64" height="64" fill="currentColor"/>
    <rect x="576" y="832" width="64" height="64" fill="currentColor"/>
  </g>
</svg>
