<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="E1a — 32px 独立重画">
  <!-- 32px 独立重画，全部坐标落在 32 的整数倍（1px = 32）。
       提环外径 4px（r 48 / 描边 32 = 1px）；锥顶 2px 高、檐 8×1px、灯身 6×10px、玻璃 4×8px、
       火焰 2×3px + 1px 尖、底座 6×2px、双脚 1×1px。包围盒 224–800 = 18px，上下留白 224 / 224。
       32 档不画竖框：4px 玻璃再切两刀就只剩缝，会让灯身读成「栅栏」。 -->
  <defs>
    <mask id="e1aPane32" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="448" y="416" width="128" height="256" fill="#FFFFFF"/>
      <path d="M496 448 L528 448 L528 480 L544 480 L544 576 L480 576 L480 480 L496 480 Z" fill="#000000"/>
    </mask>
    <mask id="e1aBody32" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="416" y="384" width="192" height="320" fill="#FFFFFF"/>
      <rect x="448" y="416" width="128" height="256" fill="#000000"/>
    </mask>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#070A12"/>
  <circle cx="512" cy="528" r="240" fill="#17314F"/>
  <rect x="448" y="416" width="128" height="256" fill="#F2FAFF"/>
  <rect x="448" y="416" width="128" height="256" fill="#2C507F" mask="url(#e1aPane32)"/>
  <rect x="416" y="384" width="192" height="320" fill="#DCE9F8" mask="url(#e1aBody32)"/>
  <circle cx="512" cy="288" r="48" fill="none" stroke="#6EA8FF" stroke-width="32"/>
  <path d="M432 288 L592 288 L640 352 L384 352 Z" fill="#F4FAFF"/>
  <rect x="384" y="352" width="256" height="32" fill="#F4FAFF"/>
  <rect x="416" y="704" width="192" height="64" fill="#F4FAFF"/>
  <rect x="416" y="768" width="32" height="32" fill="#F4FAFF"/>
  <rect x="576" y="768" width="32" height="32" fill="#F4FAFF"/>
</svg>
