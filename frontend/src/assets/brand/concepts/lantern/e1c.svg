<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="E1c — 提灯（圆环 + 窄圆顶 + 圆桶身 + 细框）">
  <!--
    E1c · 圆环 + 窄圆顶 + 圆桶身 + 细框（青绿）
    整体包围盒 y 224–800、x 382–642：中心 (512,512)，上下留白 224 / 224。
    提环：整圆 (512,304) r 60、描边 40 → 外径 160 × 160，顶端 224、底端 384；露在圆顶 288 之上的可见弧高 64。
    圆顶：半椭圆 x 408–616（宽 208，只有檐的 0.80 倍）ry 84，顶 288、平底 372。
    出檐：x 382–642 宽 260 = 桶身 206 的 1.262 倍 × 36。
    桶身：上下平边 (420,408)–(604,408) 与 (604,708)–(420,708)，两侧鼓起，最宽 206（411–613）
            → 可见 206 × 300，高宽比 1.456。这是本轮新换的形体：旧版的整椭圆上下都收成尖，
            加上圆顶就变成「人形 / 铃铛」，所以改成平顶平底的桶身。
    细框：玻璃面 434–590 × 450–706（圆角 28）；两根 16 宽竖框（456–472 / 552–568），玻璃 22 / 80 / 22 三格。
    火焰：尖顶 (512,492)、平底 616、最宽 48，高 124；负空间，透出亮芯。
    底座：x 402–622 宽 220（1.068 倍）× 48；双脚各 40 × 24。
  -->
