<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="E1c — 16px 独立重画">
  <!-- 16px 独立重画，坐标全落 64 的整数倍。包围盒 128–896 = 12px，上下留白 2px / 2px。
       圆环退化为 2×1px 的圆点（1px 内画不出环）；檐 6×2px；身 4×7px；座 6×1px；双脚 1×1px。
       16 档删掉圆顶之外的玻璃与火焰——只留「檐比身宽、座比身宽」这一层关系。 -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#04120F"/>
  <circle cx="512" cy="544" r="256" fill="#0B3A31"/>
  <rect x="448" y="128" width="128" height="64" fill="#5EF0C8"/>
  <rect x="320" y="192" width="384" height="128" fill="#DFFBF2"/>
  <rect x="384" y="320" width="256" height="448" fill="#C2EDE0"/>
  <rect x="320" y="768" width="384" height="64" fill="#DFFBF2"/>
  <rect x="384" y="832" width="64" height="64" fill="#DFFBF2"/>
  <rect x="576" y="832" width="64" height="64" fill="#DFFBF2"/>
</svg>
