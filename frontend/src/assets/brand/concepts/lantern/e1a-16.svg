<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="E1a — 16px 独立重画">
  <!-- 16px 独立重画，全部坐标落在 64 的整数倍（1px = 64）。包围盒 128–896 = 12px，上下留白 2px / 2px。
       环 2×1px（是一个方块，读不出环，但保证顶部有「提」的凸起）；檐 6×2px；身 4×7px；座 6×1px；双脚 1×1px。
       16 档删掉玻璃、竖框与火焰——1px 里它们只会把灯身涂成一团。 -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#070A12"/>
  <circle cx="512" cy="544" r="256" fill="#17314F"/>
  <rect x="448" y="128" width="128" height="64" fill="#6EA8FF"/>
  <rect x="320" y="192" width="384" height="128" fill="#F4FAFF"/>
  <rect x="384" y="320" width="256" height="448" fill="#DCE9F8"/>
  <rect x="320" y="768" width="384" height="64" fill="#F4FAFF"/>
  <rect x="384" y="832" width="64" height="64" fill="#F4FAFF"/>
  <rect x="576" y="832" width="64" height="64" fill="#F4FAFF"/>
</svg>
