<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Variant A1 — Hanging seam">
  <!--
    A1 · 横杆悬挂 + 偏左的缝
    形状 4 个：横杆、左帘、右帘、缝里透出的光（底板不计）。
    横杆 y152→188 高 36、x84→940，比布边（120 / 904）各出头 36。
    缝上端 130 宽（340→470），下端 210 宽（300→510），缝心落在 37% 处，向下张开。
    左帘 220 宽 : 右帘 434 宽；左帘下缘 868、右帘 882，中段各自抬起约 30。
  -->
  <defs>
    <radialGradient id="plate" cx="512" cy="480" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B211E"/>
      <stop offset="0.55" stop-color="#071613"/>
      <stop offset="1" stop-color="#030A09"/>
    </radialGradient>
    <linearGradient id="rodBone" x1="84" y1="152" x2="940" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9B5A6"/>
      <stop offset="0.35" stop-color="#F2EDE0"/>
      <stop offset="1" stop-color="#C9C4B2"/>
    </linearGradient>
    <linearGradient id="leftCloth" x1="130" y1="200" x2="330" y2="870" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0D79A"/>
      <stop offset="0.5" stop-color="#C7A25C"/>
      <stop offset="1" stop-color="#8E6C39"/>
    </linearGradient>
    <linearGradient id="rightCloth" x1="900" y1="200" x2="520" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F6E64"/>
      <stop offset="0.55" stop-color="#17453F"/>
      <stop offset="1" stop-color="#0A2622"/>
    </linearGradient>
    <linearGradient id="lightSeam" x1="380" y1="188" x2="440" y2="870" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF2CF"/>
      <stop offset="0.45" stop-color="#E8E0CD"/>
      <stop offset="1" stop-color="#6FC2AA"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#plate)"/>

  <path d="M340 188 L470 188 Q500 500 510 870 L300 868 Q280 520 340 188 Z" fill="url(#lightSeam)"/>
  <path d="M120 188 L340 188 Q280 520 300 868 Q230 844 120 886 Z" fill="url(#leftCloth)"/>
  <path d="M470 188 L904 188 L904 882 Q690 844 510 870 Q500 500 470 188 Z" fill="url(#rightCloth)"/>

  <rect x="84" y="152" width="856" height="36" rx="8" fill="url(#rodBone)"/>
</svg>
