<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Variant A2 — Pleats">
  <!--
    A2 · 悬挂 + 褶皱
    形状 4 个：横杆、一幅布、两道阴褶、一道亮褶（褶线共 3 条）。
    杆 y152→188、x84→940；布上缘 200→860（660 宽）挂在杆下，下缘散到 84→940（856 宽），
    上窄下宽像被杆收住再垂开；下缘两侧 900/878、中段抬到 830。
    褶宽 22 / 96 / 26，间距 280 / 220 —— 阴缝细、亮褶宽，宽度和间距都不等。
  -->
  <defs>
    <radialGradient id="plate" cx="512" cy="480" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B211E"/>
      <stop offset="0.55" stop-color="#071613"/>
      <stop offset="1" stop-color="#030A09"/>
    </radialGradient>
    <linearGradient id="rodBone" x1="84" y1="152" x2="940" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9B5A6"/>
      <stop offset="0.35" stop-color="#F2EDE0"/>
      <stop offset="1" stop-color="#C9C4B2"/>
    </linearGradient>
    <linearGradient id="cloth" x1="180" y1="200" x2="900" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0D79A"/>
      <stop offset="0.5" stop-color="#C7A25C"/>
      <stop offset="1" stop-color="#8E6C39"/>
    </linearGradient>
    <linearGradient id="foldLight" x1="580" y1="140" x2="640" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF2CF"/>
      <stop offset="0.5" stop-color="#E8E0CD"/>
      <stop offset="1" stop-color="#8FC9B6"/>
    </linearGradient>
    <clipPath id="clothClip">
      <path d="M200 188 L860 188 Q900 560 940 872 Q840 830 720 872 Q600 826 470 866 Q330 812 210 862 Q140 890 84 900 Z"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#plate)"/>

  <g clip-path="url(#clothClip)">
    <path d="M200 188 L860 188 Q900 560 940 872 Q840 830 720 872 Q600 826 470 866 Q330 812 210 862 Q140 890 84 900 Z" fill="url(#cloth)"/>
    <path d="M310 140 Q322 560 306 980 L330 980 Q340 560 332 140 Z" fill="#071613"/>
    <path d="M552 140 Q590 560 562 980 L652 980 Q660 560 606 140 Z" fill="url(#foldLight)"/>
    <path d="M808 140 Q820 560 806 980 L832 980 Q840 560 830 140 Z" fill="#071613"/>
  </g>

  <rect x="84" y="152" width="856" height="36" rx="8" fill="url(#rodBone)"/>
</svg>
