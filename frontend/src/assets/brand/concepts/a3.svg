<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Variant A3 — Tied panel">
  <!--
    A3 · 横杆 + 被束起的一侧
    形状 4 个：横杆、窄帘（被束起）、束带、宽帘。
    杆 y152→188；窄帘 120→302 宽 182，只垂到 744 就被束带（y604→648，x104→328）系住；
    宽帘 420→904 宽 484，垂到 884，左缘从 420 斜到 460 —— 是被拉向一边，不是对半分。
    两片之间上端 118、下端 322 的空隙就是不闭合的「缺口」。
  -->
  <defs>
    <radialGradient id="plate" cx="512" cy="480" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B211E"/>
      <stop offset="0.55" stop-color="#071613"/>
      <stop offset="1" stop-color="#030A09"/>
    </radialGradient>
    <linearGradient id="rodBone" x1="84" y1="152" x2="940" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9B5A6"/>
      <stop offset="0.35" stop-color="#F2EDE0"/>
      <stop offset="1" stop-color="#C9C4B2"/>
    </linearGradient>
    <linearGradient id="narrowCloth" x1="130" y1="200" x2="300" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0D79A"/>
      <stop offset="0.55" stop-color="#C7A25C"/>
      <stop offset="1" stop-color="#8E6C39"/>
    </linearGradient>
    <linearGradient id="wideCloth" x1="900" y1="200" x2="420" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F6E64"/>
      <stop offset="0.55" stop-color="#17453F"/>
      <stop offset="1" stop-color="#0A2622"/>
    </linearGradient>
    <linearGradient id="tieBone" x1="104" y1="604" x2="328" y2="648" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9C4B2"/>
      <stop offset="0.4" stop-color="#F2EDE0"/>
      <stop offset="1" stop-color="#BDB8A8"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#plate)"/>

  <path d="M420 188 L904 188 L904 884 Q660 844 460 880 Q450 520 420 188 Z" fill="url(#wideCloth)"/>
  <path d="M120 188 L302 188 Q296 470 288 744 Q214 754 138 744 Q132 470 120 188 Z" fill="url(#narrowCloth)"/>

  <rect x="104" y="604" width="224" height="44" rx="6" fill="url(#tieBone)"/>
  <rect x="84" y="152" width="856" height="36" rx="8" fill="url(#rodBone)"/>
</svg>
