<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.title.full">帷幕 · AI 跑团平台</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/svg+xml" href="/assets/brand/icon-simple.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#071613">
    <!-- Bootstrap 5.3.0 随包本地分发：离线/内网部署时不再依赖 jsDelivr，
         否则 CSS 加载失败会让弹窗塌进文档流、整页布局错乱。 -->
    <link href="/assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/vendor/font-awesome/css/font-awesome.min.css">
    <!-- 主题字体：Cinzel 提供石刻式展示标题，EB Garamond 负责拉丁正文，Noto Serif SC 负责中文，
         经字体镜像以 unicode-range 子集按需加载 -->
    <link rel="preconnect" href="https://fonts.font.im" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.font.im" crossorigin>
    <!-- 「赛博档案」主题追加 Rajdhani（展示标题）与 Share Tech Mono（编号/数据标签） -->
    <link rel="stylesheet" href="https://fonts.font.im/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@400;600&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
    <link rel="stylesheet" href="js/react/main.css">
</head>
<body>
    <div id="react-runtime-root"></div>
    <!-- 网站 Agent：悬浮球与可拖拽窗口由 React 挂载在此，渲染到 body 末尾 -->
    <div id="react-agent-portalroot"></div>
    <div class="notification-container"></div>
    <div class="container-fluid">
        <div class="row h-100">
            <!-- 左侧导航栏由 React 渲染，保持旧脚本依赖的 DOM id/class -->
            <div id="react-sidebar-root"></div>

            <!-- 中间内容区 -->
