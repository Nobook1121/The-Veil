<template id="scenario-card">
{{{ coverHtml }}}
<div class="scenario-card-body">
    <div class="scenario-card-title" data-user-content="true">{{ title }}</div>
    <div class="scenario-card-meta">
        <p><span data-i18n="scenario.card.author">作者</span>：<span data-user-content="true">{{ author }}</span></p>
        <p><span data-i18n="scenario.card.creator">创建者</span>：<span data-user-content="true">{{ createdBy }}</span></p>
        <p><span data-i18n="scenario.card.players">推荐人数</span>：{{ playerCount }}</p>
        <p><span data-i18n="scenario.card.version">Version</span>：<span data-user-content="true">{{ scenarioVersion }}</span></p>
    </div>
    <div class="scenario-card-actions">
        <button class="btn btn-sm btn-success play-scenario" data-id="{{ id }}">
            <span data-i18n="scenario.list.play">游玩</span>
        </button>
        {{{ actionButtons }}}
    </div>
    <div class="scenario-id-chip"><span data-i18n="scenario.card.id">ID</span> <span data-user-content="true">{{ publicId }}</span></div>
</div>
</template>

<template id="scenario-preview-content">
<div class="scenario-preview">
    <h3 data-user-content="true">{{ title }}</h3>
    <div class="scenario-preview-meta">
        <p><strong><span data-i18n="scenario.preview.id">剧本ID</span>：</strong><span data-user-content="true">{{ publicId }}</span></p>
        <p><strong><span data-i18n="scenario.preview.version">剧本版本</span>：</strong><span data-user-content="true">{{ scenarioVersion }}</span></p>
        <p><strong><span data-i18n="scenario.preview.author">作者</span>：</strong><span data-user-content="true">{{ author }}</span></p>
        <p><strong><span data-i18n="scenario.preview.player_count">推荐人数</span>：</strong>{{ playerCount }}</p>
        <p><strong>知识库向量数：</strong><span data-user-content="true">{{ vectorCount }}</span> <span class="text-muted">（{{ vectorBackend }}）</span></p>
    </div>
    <div class="scenario-preview-notes">
        <h4 data-i18n="scenario.preview.notes">简介</h4>
        <p data-user-content="true">{{ notes }}</p>
    </div>
    <h4 data-i18n="scenario.preview.modules">模块</h4>
    <div class="scenario-preview-segment" hidden aria-hidden="true"></div>
    {{{ modulesHtml }}}
</div>
</template>

<template id="scenario-preview-modal">
<div class="modal-dialog modal-lg">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" data-i18n="scenario.preview.title">剧本预览</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-aria-label="scenario.modal.close" aria-label="关闭"></button>
        </div>
        <div class="modal-body">{{{ previewContent }}}</div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="scenario.preview.cancel">关闭</button>
        </div>
    </div>
</div>
</template>
<div id="scenarioImportCardSearch" hidden></div><select id="scenarioImportSpoilerFilter" hidden></select>

<template id="notification-message">
<div class="notification {{ variant }}">{{ message }}</div>
</template>
