<template id="chat-message">
<div class="message-avatar">
    <img src="{{ avatarSrc }}" alt="{{ sender }}">
</div>
<div class="message-content-container">
    <div class="message-header">
        <span class="message-sender">{{ sender }}</span>
        <span class="message-time">{{ displayTime }}</span>
    </div>
    <div class="message-content markdown-body" data-user-content="true">{{{ contentHtml }}}</div>
    <div class="message-meta">{{{ processingHtml }}}{{{ knowledgeHtml }}}</div>
</div>
</template>

<template id="chat-processing-time">
<div class="processing-time">{{ text }}</div>
</template>

<template id="chat-knowledge-usage">
<div class="knowledge-usage" title="{{ title }}">{{ text }}</div>
</template>

<template id="chat-welcome">
<div class="welcome-text">请选择或创建一个房间开始游戏。</div>
</template>
