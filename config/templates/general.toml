# 「帷幕 The Veil」全局配置模板（L2 层）。
#
# 加载优先级（低 → 高）：代码内默认值 < 本模板 < data/config/general.toml（首次启动
# 由本模板复制生成）< 环境变量 AI_TRPG_CFG_<段>_<键> < CLI 参数。
# 用户配置里缺失的键会回落到本模板的值；本模板也缺失的键回落到代码默认值。
# 修改本文件只影响「之后首次部署」生成的用户配置；已存在的用户配置不会被覆盖。

[appearance]
theme = "pattern_cyber_2"
# 允许个人选择的主题（空数组 = 全部可用）；仅管理员可写。
enabled_themes = []
# 站点默认主题参数与锁定项（JSON 字符串）；个人覆盖值优先，__locked 中的键个人不可改。
theme_overrides = "{}"

[language]
language = "zh-CN"

[notification]
enable_sound = true
enable_desktop_notification = false

[autosave]
enabled = true
interval = 300
max_nodes = 3

[room_console]
enabled = true
mirror_to_server_console = false
max_entries = 500
view_role = "admin"
execute_role = "admin"

[chat]
show_timestamp = true
message_font_size = 14
max_history_messages = 1000
# LaTeX 叙事排版总控；关闭后 KP 不注入 LaTeX 提示词，KP 与玩家消息都不渲染。
latex_enabled = true
# KP 输出是否使用 LaTeX；仅总控开启时生效。
latex_kp_enabled = true
# 玩家（含其他玩家）消息是否渲染 LaTeX；仅总控开启时生效。
latex_player_enabled = true
# 叙事排版强度：light（克制）/ standard（标准）/ rich（丰富）；仅总控与 KP 开关都开启时生效。
latex_intensity = "standard"
# 单条消息最多渲染/提示的公式片段数（行内与独立块合计）。
latex_max_formulas_per_message = 12
# 单块公式源码的最大字符数；超限片段不渲染（前端显示原文，AI 上下文替换为 [公式]）。
latex_max_formula_chars = 300
# 历史清洗后单条消息的最大字符数；超出截断，防止上下文膨胀。
latex_max_clean_message_chars = 2000

[ai]
stream_output = true
debug_mode = false
show_ai_hints = true
dice_critical_threshold = 1
dice_fumble_threshold = 96
# 骰子动画默认档位（text / simple / 3d）与玩家投掷默认开关、等待超时（30-300 秒）。
dice_animation_level = "3d"
dice_player_roll = true
dice_player_roll_timeout = 120
# 骰子结果来源：开=读取骰子落定后朝上的面；关=沿用服务端随机数生成器。
dice_physics_results = true
# 玩家投掷的重投模式：off（关闭）/ limited（指定次数）/ unlimited（无限）。
dice_reroll_mode = "off"
# limited 模式下的重投次数上限（1-20）。
dice_reroll_limit = 3
max_tool_rounds = 8
ai_request_timeout = 1800
ai_request_max_retries = 5
# 所有平台共用的「最大输出 token」默认值：开启后，未在请求模板里自行声明的请求统一按
# max_tokens 下发；请求模板里显式写了 max_tokens 的以模板为准。默认取宽裕值，避免靠压缩
# 输出预算省 token 而截断回复。
constrain_max_tokens = true
max_tokens = 16384
record_prompt_segments = true
cloud_embedding_enabled = false
# 首次部署引导「程序自动下载」使用的本地向量模型仓库（HuggingFace owner/name）。
# 引导页会显示这个值，改这里即可换用其它模型或镜像仓库。
local_embedding_repo = "BAAI/bge-small-zh-v1.5"

[ai.small_models]
intent_classification = ""
state_update = ""
summarization = ""
schema_repair = ""
# 世界树生成向导的「AI 语义补全」任务模型；留空则用平台声明的小模型 / 主模型。
narrative_fill = ""

[ai.prompt]
snapshot_manifest_summary_cap = 140
max_snapshot_scene_manifest = 30
snapshot_include_entity_manifest = false
max_tool_result_chars = 4000
dedupe_tool_calls = true

[ai.cache]
semantic_enabled = true
semantic_ttl_seconds = 120
exact_ttl_seconds = 300

[ai.knowledge]
top_k_default = 5
top_k_direct = 6
chunk_child_max_chars = 800
chunk_parent_max_chars = 2400
sticky_rounds = 1
cooldown_rounds = 3
keyword_channel_enabled = true
recursive_scanning = true
max_recursion_depth = 3
lorebook_token_budget = 0

[character_rules]
attribute_ratio_percent = 20
max_cards_per_user = 3
weapon_slot_count = 5
attribute_roll_str = "3d6x5"
attribute_roll_dex = "3d6x5"
attribute_roll_siz = "(2d6+6)x5"
attribute_roll_app = "3d6x5"
attribute_roll_con = "3d6x5"
attribute_roll_int = "(2d6+6)x5"
attribute_roll_pow = "3d6x5"
attribute_roll_edu = "(2d6+6)x5"
attribute_roll_luc = "3d6x5"

[scenario]
trigger_max_file_size = 5242880
draft_autosave_interval = 300

[window]
remember_window_size = true
window_width = 1200
window_height = 800

[update]
check_update_on_startup = true
auto_update = false

[site_agent]
enabled = true
max_tool_rounds = 6
request_timeout = 120
max_history_messages = 40
max_tool_result_chars = 4000
max_message_chars = 4000
max_turns_per_hour = 60
daily_token_budget = 200000
conversation_retention_days = 30
action_ttl_seconds = 300
max_conversations_per_user = 30
max_messages_per_conversation = 200

[immersive]
# 沉浸系统总开关：关闭后配乐与配图都不再随叙事触发（前端仍可手动播放房间 BGM）。
enabled = true
# 实时程序化配乐：由服务端分析叙事氛围，前端 Web Audio 现场合成，无版权风险。
# 默认关闭：新实例首次启动不自动播放音乐，由用户在「设置 - 实时沉浸」中开启。
music_enabled = false
# 叙事氛围变化时自动切歌/换段；关闭后仅首次进入房间按默认档位播放。
music_auto_switch = true
# 默认氛围档位（daily/suspense/unease/horror/urgency/sorrow/awe/aftermath）。
music_default_profile = "daily"
# 默认强度（low/medium/high），影响配器厚度、节奏密度与不协和程度。
music_default_intensity = "medium"
# 程序化配乐音量（0-100），与房间 BGM 播放器音量相互独立。
music_volume = 35
# 换段交叉淡入淡出时长（毫秒，500-10000）。
music_crossfade_ms = 3000
# 氛围切换的滞回回合数：连续若干回合都指向新氛围才真正切换，避免来回抖动。
music_hysteresis_turns = 2
# 配乐随机种子（留空按房间 ID 派生）。同一房间 + 同一种子可复现同一套乐句走向。
music_seed = ""
# 程序化配乐播放时自动压低房间 BGM 音量（避免两路声音互相干扰）。
music_duck_bgm = true
# 实时配图总开关（默认关闭；开启后按叙事触发场景图）。
illustration_enabled = false
# 配图来源：procedural（确定性程序化 SVG，离线可用）/ platform（从「生图模型平台表」取默认平台）。
# 旧值 openai_compatible 仍可识别，但会一次性迁移到平台表，运行期不再读取下面的单条配置。
illustration_provider = "procedural"
# 默认生图平台 ID（procedural 时忽略；留空取平台表里的默认条目）。
illustration_platform_id = ""
# 是否随叙事自动触发配图；关闭后只能从房间控制台手动触发。
illustration_auto = true
# 【已弃用】旧单条生图配置：仅用于一次性迁移到生图平台表，迁移后会被清空。
# 新配置请使用管理员的「生图模型平台配置」入口（多平台、可设默认、独立密钥）。
illustration_base_url = ""
# 【已弃用】旧单条生图模型名。
illustration_model = "dall-e-3"
# 【已弃用】旧单条生图尺寸。
illustration_size = "1024x1024"
# 【已弃用】旧生图接口密钥；新流程按平台条目分别存储，只回掩码。
api_key = ""
# 单次生图请求超时（秒，20-600）；网关约 20s 空闲断流时会在总预算内重试。
illustration_timeout = 120
# 并发生图请求上限（1-4），避免同时打满上游。
illustration_concurrency = 2
# 站点级每日生图预算（张，0 表示不限制；仅管理员可改）。
illustration_daily_budget = 0
# 单房间每小时生图上限（张，0 表示不限制；房主/管理员也可在房规内收紧）。
illustration_room_hourly_cap = 12
# 自动配图的最小间隔回合数（同房间），避免连续刷图。
illustration_min_turns = 4
# 配图触发档位：off / important（仅重要场景转换）/ turn_interval（每 N 回合）/ frequent。
illustration_trigger = "important"
# 允许个人覆盖的触发档位（逗号分隔）；off 始终允许，作为个人收紧项。
illustration_trigger_allowed = "important,turn_interval,frequent"
# AI KP 配图判断：平台/模型统一使用「模型设置」中启用的聊天平台，不再单独配置；
# 这里只保留超时与预算，复用既有重试链路。
illustration_kp_timeout = 45
illustration_kp_daily_budget = 200
illustration_kp_max_context_chars = 1600
# NPC 头像：与场景图区分尺寸；同一 NPC 在房间内复用，每回合最多新增一张。
illustration_npc_enabled = false
illustration_npc_size = "768x768"
illustration_npc_max_per_turn = 1
# 房间级配图缓存：图片与索引写入房间目录（immersive_cache/），随房间归档保留。
# 条目数与容量上限，0 表示不限制；超限策略 lru（驱逐最久未命中）或 reject（拒绝新图）。
illustration_room_cache_max_entries = 40
illustration_room_cache_quota_mb = 64
illustration_room_cache_max_image_mb = 8
illustration_room_cache_overflow = "lru"
# 音乐来源：realtime（仅实时配乐）/ bgm（仅 BGM）/ hybrid（实时配乐主层 + BGM 底噪）。
music_source = "hybrid"
# 允许个人选择的音乐来源档位（逗号分隔）；个人只能在站点允许集合内覆盖。
music_source_allowed = "realtime,bgm,hybrid"
# 关闭后个人设置中的音乐来源不可覆盖，只能跟随站点默认。
music_source_allow_personal = true
# 剧本配图缓存：是否把新生成的配图写入剧本目录（默认关闭，避免无声修改剧本与磁盘增长）。
illustration_scenario_record = false
# 游玩时是否优先复用剧本目录里的同 key 配图（默认开启，可省去重复生图与预算）。
illustration_scenario_prefer = true
# 单剧本配图缓存容量上限（MB，0 表示不限制）；超限按下方策略处理。
illustration_scenario_quota_mb = 256
# 单张配图写入剧本的体积上限（MB）。
illustration_scenario_max_image_mb = 8
# 超限策略：lru = 驱逐最旧条目；reject = 拒绝写入（保留原图）。
illustration_scenario_overflow = "lru"
# LLM 音乐导演：读取最近叙事上下文输出结构化乐谱；关闭时仅用规则分析器。
music_director_enabled = false
# 导演使用的平台/模型统一取「模型设置」中启用的 AI 平台，不再单独配置。
# 触发频率：每 N 个叙事回合尝试一次（阶段/情绪事件会额外提前触发）。
music_director_interval_turns = 2
# 站点级每日导演调用预算（次，0 表示不限制；房间只能收紧）。
music_director_daily_budget = 0
# 单次导演请求超时（秒，20-300）。
music_director_timeout = 45
# 乐谱缓存 TTL（秒，0 表示不复用缓存）。
music_director_cache_ttl = 3600
# 最低置信度（0-100）：低于该值的乐谱视为低置信，回退到规则分析器。
music_director_min_confidence = 55
# 失败回退策略：rule（回退规则分析器）/ hold（保持当前档位不切换）。
music_director_fallback = "rule"
# 送给导演的最近上下文最大字符数（200-4000）。
music_director_max_context_chars = 1200
# AI 对话语音配音：默认关闭；默认使用系统音色（浏览器 Web Speech），无需外部服务。
voice_enabled = false
# 引擎：system（前端系统音色，本阶段唯一可用）/ local / cloud（仅占位，未实现）。
voice_engine = "system"
# 允许的引擎白名单（逗号分隔）；local/cloud 不在白名单或未实现时明确降级为 engine_unavailable。
voice_engine_allowed = "system"
# 是否自动播放（仍受浏览器首次手势限制；默认关闭，需用户点击开启语音）。
voice_autoplay = false
# 语音音量（0-100，与背景音乐音量相互独立）。
voice_volume = 70
# 语速百分比（50-200，100 为正常）。
voice_rate = 100
# 单回合配音字符上限（40-4000，超出部分不发声）。
voice_max_turn_chars = 800
# 单段配音字符上限（10-500，长旁白会在句末标点处切块）。
voice_max_segment_chars = 40
# 单回合最多配音片段数（1-200）。
voice_max_segments = 24
# 新回合与正在播放的语音冲突时：interrupt（打断）/ queue（排队）。
voice_interrupt_policy = "interrupt"
# 语音播放期间压低背景音乐与实时配乐。
voice_ducking = true
# 压低强度（0-90，数字越大音乐越轻）；房间只能调高不能调低。
voice_ducking_level = 35
# 单房间每小时配音回合上限（0 表示不限制；房间只能调低）。
voice_room_hourly_cap = 120
# 云端引擎占位配置：本阶段不调用；如需凭据，统一使用「模型设置」里的 AI 平台，
# 语音配置不再单独保存 API Key（旧配置残留字段读取时忽略）。
voice_cloud_base_url = ""
voice_cloud_model = ""
# 本地多音色引擎：sherpa-onnx + Kokoro-82M-v1.1-zh（Apache-2.0，24kHz，103 个说话人）。
# 默认关闭；启用前需用 `voice local install` 下载权重（不会随仓库分发）。
voice_local_enabled = false
# 留空 = 由主进程托管 127.0.0.1 子服务；填写则连接管理员自托管的回环服务。
voice_local_base_url = ""
voice_local_model = "kokoro-int8-multi-lang-v1_1"
# 语音合成并发（默认 1）；实时配图运行时语音会排队让路，避免争抢 CPU。
voice_local_concurrency = 1
# 单句合成超时（秒）；超时按 local_timeout 降级回浏览器音色。
voice_local_timeout = 30
# 站点默认的人设→真实说话人绑定（JSON）。留空使用内置默认表；
# 示例：voice_local_speakers = '{"narrator": 24, "npc_male_elder": 102}'
# 房间可在 voice.json 的 local_speakers 中覆盖（仅限本房间）。
voice_local_speakers = ""
# 语音缓存：落盘到每个房间的 immersive_cache/voice/，随房间归档保留。
voice_cache_enabled = true
voice_cache_quota_mb = 64
voice_cache_max_entries = 300
# 超限策略：lru（淘汰最久未使用）或 reject（拒绝写入）。
voice_cache_overflow = "lru"
# 是否允许个人覆盖语音开关/自动播放/音量/语速（关闭后只能跟随站点默认）。
voice_allow_personal = true

[site]
# 站点名称：显示在浏览器标题与页面品牌处（留空使用默认品牌）。
name = ""
# 站点域名（可选）：仅作展示与外链用途。
domain = ""
# 首次部署引导是否已跳过/完成；false 时新部署首次访问会进入引导页。
setup_dismissed = false

[network]
# HTTP 服务监听端口（修改后需重启服务生效）。
port = 8086
# 局域网 UDP 发现：允许同网段设备搜索到本实例。
discovery_enabled = true
# 生成房间邀请链接/二维码时使用的对外基础地址（如 http://192.168.1.10:8086）。
# 留空表示跟随访问者当前地址栏，由前端自动推断。
share_base_url = ""

[network.access_control]
# 访问控制白名单（预留能力）。
enabled = false
allowed_ips = []

[network.penetration]
# 内网穿透开关（启停需重启穿透进程生效）。
enabled = false
# 穿透服务类型（当前支持 ngrok）。
type = "ngrok"
# 端口映射列表（JSON 数组，元素为映射对象）。
port_mappings = []

[network.penetration.settings]
# 穿透服务鉴权令牌（密钥，默认留空，由部署方自行填写）。
auth_token = ""
region = "us"
subdomain = ""
